<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crayonkid — Coming Soon</title>
<meta name="description" content="Crayonkid is launching soon. Join the waitlist.">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0a0a0f; color: #f2f2f5; padding: 24px; }
  .card { max-width: 520px; width: 100%; text-align: center; }
  h1 { font-size: 2.4rem; letter-spacing: -0.02em; margin-bottom: 12px; }
  p.sub { color: #a1a1aa; font-size: 1.05rem; margin-bottom: 28px; line-height: 1.6; }
  form { display: flex; gap: 8px; }
  input[type=email] { flex: 1; padding: 14px 16px; border-radius: 10px; border: 1px solid #2a2a35;
                     background: #14141b; color: #fff; font-size: 1rem; }
  input[type=email]:focus { outline: none; border-color: #6d6df5; }
  button { padding: 14px 22px; border-radius: 10px; border: 0; background: #6d6df5; color: #fff;
           font-size: 1rem; font-weight: 600; cursor: pointer; }
  button:hover { background: #5a5ae0; }
  .ok { display: none; color: #4ade80; margin-top: 16px; font-weight: 600; }
  .foot { margin-top: 36px; color: #52525b; font-size: .85rem; }
  @media (max-width: 480px) { form { flex-direction: column; } h1 { font-size: 1.9rem; } }
</style>
</head>
<body>
  <div class="card">
    <h1>Crayonkid</h1>
    <p class="sub">We're building something worth your attention.<br>Join the waitlist — you'll hear from us first.</p>
    <!-- Phase 2: point data-endpoint at the Cloudflare Worker subscribe route -->
    <form id="waitlist" data-endpoint="">
      <input type="email" name="email" placeholder="you@example.com" required aria-label="Email">
      <button type="submit">Notify me</button>
    </form>
    <p class="ok" id="okmsg">You're on the list. ✅</p>
    <p class="foot">crayonkid.mehyar.us · built in the open</p>
  </div>
<script>
  document.getElementById('waitlist').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target, email = new FormData(form).get('email');
    const endpoint = form.dataset.endpoint;
    try {
      if (endpoint) {
        await fetch(endpoint, { method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, venture: 'crayonkid' }) });
      } else {
        localStorage.setItem('waitlist:' + email, new Date().toISOString());
      }
    } catch (err) { /* offline fallback below */ }
    form.style.display = 'none';
    document.getElementById('okmsg').style.display = 'block';
  });
</script>
</body>
</html>
